name: Build 2DS XL CIA & 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install makerom & bannertool
        run: |
          apt-get update && apt-get install -y wget unzip
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O /tmp/makerom.zip
          unzip -o /tmp/makerom.zip -d /opt/devkitpro/tools/bin/
          chmod +x /opt/devkitpro/tools/bin/makerom
          wget -q https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool.zip -O /tmp/bannertool.zip
          unzip -o -j /tmp/bannertool.zip linux-x86_64/bannertool -d /opt/devkitpro/tools/bin/
          chmod +x /opt/devkitpro/tools/bin/bannertool

      - name: Compile exo.3dsx and exo.cia
        run: |
          export PATH="/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH"
          make cia

      - name: Upload exo.cia & exo.3dsx Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exo-2ds-xl-cia
          path: |
            exo.cia
            exo.3dsx
            exo.smdh
            tools/remote_install_cia.py
